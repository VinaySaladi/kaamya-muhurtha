# One-click deploy on Render (render.com): New + > Blueprint > point to this repo.
services:
  - type: web
    name: kaamya-muhurtha
    runtime: docker
    plan: starter
    region: singapore
    healthCheckPath: /health
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: KAAMYA_API_KEY
        generateValue: true
      - key: KAAMYA_ADMIN_KEY
        generateValue: true
      - key: KAAMYA_MODEL
        value: claude-sonnet-5-5
      - key: KAAMYA_AUTO_APPROVE
        value: "false"
      - key: KAAMYA_DB_PATH
        value: /data/kaamya_muhurtha.db
      - key: KAAMYA_DATABASE_URL     # optional: Supabase Postgres instead of the SQLite file
        sync: false
      - key: KAAMYA_WEBHOOK_URL      # Kaamya Node API: https://<api>/api/v1/webhooks/muhurtha
        sync: false
      - key: KAAMYA_WEBHOOK_SECRET   # same value as MUHURTHA_WEBHOOK_SECRET on the Node API
        sync: false
